name: Release
on:
  workflow_dispatch:
    inputs:
      release_type:
        description: "Select release type"
        required: true
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major
      release_scope:
        description: "Select scope "
        required: true
        default: "both_app_helm"
        type: choice
        options:
          - helm
          - app
          - both_helm_app    
jobs:
  change-version:
    outputs:
      release_version: ${{steps.update.outputs.release_version}}
      app_ver: ${{steps.update.outputs.app_ver}}
      helm_ver: ${{steps.update.outputs.helm_ver}}
    permissions:       
        packages: read # to deploy to Pages
        contents: write
        id-token: write 
        
    runs-on: ubuntu-latest
    steps:
    - name: checkout
      uses: actions/checkout@master
    - name: update version
      id: update
      run: |
        ./release.sh ${{inputs.release_scope}} ${{inputs.release_type}} 
        ./version.sh
        echo "app_ver=$(cat app_version)" >> $GITHUB_OUTPUT
        echo "helm_ver=$(cat helm_version)" >> $GITHUB_OUTPUT
        echo "release_version=app-$(cat app_version)-helm-$(cat helm_version)" >> $GITHUB_OUTPUT
#    - name: Add workflow version to deploy.yml
#      id: add
#      run: |
#        sed -i -e    "/"placeholderxyz"/a\"${{ steps.update.outputs.release_version }}\"," .github/workflows/deploy.yml 


    - name: commit new version
      uses: EndBug/add-and-commit@v10 # You can change this to use a specific version.
      with:
        #add: '*' 
        add: '["helm_version", "app_version" ,"app/Cargo.toml", "helm/app/Chart.yaml", "helm/app/values.yaml"]'
          ### ".github/workflows/deploy.yml"]'
        author_name: Release
        author_email: release@github.com
        committer_name: Release
        committer_email: mail@example.com
        default_author: github_actions
        message: ' app:${{ steps.update.outputs.app_ver }} helm:${{ steps.update.outputs.helm_ver }} '
       # new_branch: custom-new-branch
  #      pathspec_error_handling: ignore
        tag: 'app-${{ steps.update.outputs.app_ver }}-helm-${{ steps.update.outputs.helm_ver }}'
        tag_push: '--force'

    - name: Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: 'app-${{ steps.update.outputs.app_ver }}-helm-${{ steps.update.outputs.helm_ver }}'


  start-ci:
    needs: change-version
    with:
      release_version: ${{ needs.change-version.outputs.release_version}}
      helm_ver: ${{ needs.change-version.outputs.app_ver}}
      app_ver: ${{ needs.change-version.outputs.helm_ver}}
    uses:
      ./.github/workflows/ci.yml

  deploy:
    needs: 
     - change-version
     - start-ci
    with:
      release_version: ${{ needs.change-version.outputs.release_version}}
      helm_ver: ${{ needs.change-version.outputs.app_ver}}
      app_ver: ${{ needs.change-version.outputs.helm_ver}}
    uses:
      ./.github/workflows/deploy.yml
