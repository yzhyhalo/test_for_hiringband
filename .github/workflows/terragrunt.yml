name: "Terragrunt GitHub Actions Create\ Init"

# Controls when the workflow will run
on:
  #  # Triggers the workflow on push or pull request events but only for the "main" branch
  #  push:
  #    branches: ["dev", "stage"]
  #  pull_request:
  #    branches: ["dev", "stage"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  terragrunt:
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
    steps:
      - name: "Checkout"
        uses: actions/checkout@v4

      # Assuming you have a mise.toml file in your repository.
      - name: Install Terragrunt and OpenTofu
        uses: gruntwork-io/terragrunt-action@v3

      - name: Run terragrunt plan
        run: |
          cd infra/envs/${GITHUB_REF}
          terragrunt plan

      - name: Run terragrunt apply
        run: |
          cd infra/envs/${GITHUB_REF}
          terragrunt init --backend-bootstrap  --non-interactive apply
          terragrunt apply --non-interactive
