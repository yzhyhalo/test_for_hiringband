# This is a basic workflow to help you get started with Actions

name: Deploy 

# Controls when the workflow will run
on:

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
    inputs:
      release_version:
        description: "Select release version"
        required: true
        type: choice
        default: placeholder
        options:
          ["app-11.0.0-helm-10.0.2",
           "app-7.0.0-helm-7.1.16",
           "app-10.0.0-helm-9.0.0",
           "placeholder",

          ]
          
          
      release_override:
        description: "Override release version with custom"
        required: false
        type: string



# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  
  # This workflow contains a single job called "build"
  deploy:
    permissions:
      pages: write  
      packages: read # to deploy to Pages
      contents: read
      id-token: write   #
      # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4 # More information on this action can be found below in the 'AWS Credentials' section
        id: login-aws
        with:
          aws-region: us-west-2
          role-to-assume: arn:aws:iam::637423298449:role/github-${{GITHUB.ref_name}}-oidc-test4hiringband
          role-session-name: EKS_Deploy_Session

      - name: Install & upgrade Helm chart on EKS
        uses: open-source-srilanka/eks-helm-client-github-action@v1.0.0
        env:
          REGION_CODE: us-west-2
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLUSTER_NAME: test4hiringband-cluster-${{GITHUB.ref_name}}
        with:
          args: >
           bash -c "
           if [ -n "${{inputs.release_override}}"  ]; then
              echo "Overriding release"
              version=${{inputs.release_override}}
            else
              echo "Usual release"
              version=${{inputs.release_override}}
            fi
            wget https://github.com/yzhyhalo/test_for_hiringband/archive/refs/tags/$version.zip
            unzip $version.zip
            cd ${{github.ref_name}}-$version/helm/app
            ###values.file operation
            helm install aws-ecr/app --generate-name
           "
           
           
           # bash -c "
           #   helm repo add aws-ecr ${{ steps.login-aws.outputs.registry }};
           #   helm repo update;
           #   helm install aws-ecr/app --generate-name
           # "
