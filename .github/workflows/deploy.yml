# This is a basic workflow to help you get started with Actions

name: Deploy

# Controls when the workflow will run
on:

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
  

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  
  # This workflow contains a single job called "build"
  deploy:
    permissions:
      pages: write      # to deploy to Pages
      id-token: write   #
      # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4 # More information on this action can be found below in the 'AWS Credentials' section
        with:
          aws-region: us-west-2
          role-to-assume: arn:aws:iam::637423298449:role/github-oidc-provider-aws
          role-session-name: EKS_Deploy_Session

      - name: Install & upgrade Helm chart on EKS
        uses: open-source-srilanka/eks-helm-client-github-action@v1.0.0
        env:
          REGION_CODE: us-west-2
          CLUSTER_NAME: test4hiringband-cluster-${{GITHUB.ref_name}}
        with:
          args: >
            bash -c "
              helm repo add bitnami https://charts.bitnami.com/bitnami;
              helm repo update;
              helm install bitnami/mysql --generate-name
            "
