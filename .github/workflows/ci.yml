name: CI
on:
  workflow_dispatch:
  workflow_call:
  release:
  

concurrency:

  group: production-deploy
  queue: max
env: 

  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
    #LINTING-TESTING STAGE
  linter:
    uses: ./.github/workflows/linter.yml
  check-app:
    uses: ./.github/workflows/check_app.yml
    
  #BUILD-RELEASE STAGE
  build:
    uses: ./.github/workflows/build.yml
    needs: 
    - check-app
#    - linter
