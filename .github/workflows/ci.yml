name: CI
on:
  workflow_dispatch:
    
    inputs:
      release_type:
        description: "Select release type"
        required: true
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major
concurrency:

  group: production-deploy
  queue: max
env: 
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
    #LINTING-TESTING STAGE
  linter:
    uses: ./.github/workflows/linter.yml
    
  check-app:
    uses: ./.github/workflows/check_app.yml
  #BUILD STAGE
  build:
    uses: ./.github/workflows/build.yml
    needs: [check-app,linter]
  #RELASE HELM APP
  release:
    uses: ./.github/workflows/release.yml
    needs: build
