name: CI
on:
  workflow_dispatch:
    inputs:
      release_scope:
        description: "Select scope "
        required: true
        default: "app-x.x.x-helm-x.x.x."
        type: string

  workflow_call:
    needs:
      - helm_ver
      - app_ver
      - tag_ver
concurrency:

  group: production-deploy
  queue: max
env: 

  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
    #LINTING-TESTING STAGE
  linter:
    uses: ./.github/workflows/linter.yml
  check-app:
    uses: ./.github/workflows/check_app.yml
    
  #BUILD-RELEASE STAGE
  build:
    uses: ./.github/workflows/build.yml
    needs: 
    - check-app
#    - linter
